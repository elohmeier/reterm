name: Deploy site and firmware to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "firmware/**"
      - "profiles/**"
      - "tools/package-web-flash.sh"
      - "tools/check-palette-sync.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The editor's E1004 pigment literals must match the measured profile.
      - run: python3 tools/check-palette-sync.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run check
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/*/platformio.ini') }}
      - run: pip install platformio
      # The same label feeds the web-flash manifest below and the firmware's
      # /api/status + MQTT sw_version, so a device reports the deploy it runs.
      - run: |
          export PLATFORMIO_BUILD_FLAGS="-DRETERM_FW_VERSION=\\\"$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}\\\""
          pio run -d firmware/e1001
          pio run -d firmware/e1004
      # The deploy that publishes the editor also publishes matching firmware,
      # so the browser flasher can never hand out a stale-protocol build.
      - run: sh tools/package-web-flash.sh site/build/flash "$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
